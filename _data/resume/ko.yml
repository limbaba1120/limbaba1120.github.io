    contributions:
      - heading: 실시간 채팅 구현
        points:
          - WebSocket 및 STOMP 프로토콜로 클라이언트–서버 간 양방향 통신 구현
          - RabbitMQ를 STOMP 메시지 브로커로 사용해 채팅 메시지를 구독자에게 중계
