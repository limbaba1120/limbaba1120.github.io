          - AWS S3 + Amazon CloudFront 적용으로 콘텐츠 다운로드 시간 약 50% 단축
      - heading: Flyway 기반 DB 스키마 버전 관리 및 자동 반영
        points:
          - 여러 개발자가 테이블을 수정하면서 변경 내역이 누락되고, 개발·운영 환경의 데이터베이스 구조가 달라지는 문제 발생
          - Flyway로 테이블 생성·수정 내역을 버전별 SQL 파일로 관리
          - 적용 이력을 확인해 누락된 DB 변경 사항만 순서대로 반영하여 개발·운영 환경의 데이터베이스 구조를 일관되게 유지
      - heading: 동시 입찰의 동시성 문제 해결
        points:
          - 100명 동시 입찰 시뮬레이션 테스트 작성 → Redis 기반 분산 락을 적용해 특정 경매 상품에 대해 하나의 요청만 처리되도록 제한
          - "@DistributedLock 어노테이션 + AOP 로 비즈니스 로직과 분리된 재사용 가능한 락 컴포넌트 구현"
